# ============================================================
# Railway (tiêu chí 12)
#   Build bằng Dockerfile; Railway cấp biến PORT, Dockerfile đã lắng nghe theo ${PORT:-8000}.
#   Biến môi trường đặt trên dashboard Railway (KHÔNG ghi ở đây):
#     AGENT_API_KEY, REDIS_URL (trỏ tới Redis service), ENVIRONMENT=production,
#     RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
