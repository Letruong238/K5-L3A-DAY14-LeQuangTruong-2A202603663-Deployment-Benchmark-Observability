# ============================================================
# Render Blueprint (tiêu chí 12) — có thể dùng thay railway.toml
#   Render Dashboard → New → Blueprint → chọn repo, Render đọc file này.
#   Lưu ý: file nằm trong 06-lab-complete/ nên khi tạo Blueprint phải chỉ đường dẫn file này.
# ============================================================
services:
  # Agent (web service build từ Dockerfile)
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        sync: false             # secret: nhập tay trên dashboard, không ghi giá trị ở đây
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  # Redis (Render Key Value, tương thích Redis)
  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []             # chỉ cho các service trong cùng tài khoản Render kết nối
    maxmemoryPolicy: noeviction
