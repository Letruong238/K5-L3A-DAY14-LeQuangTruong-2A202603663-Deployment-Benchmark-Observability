# ============================================================
# Agent + Redis bằng một lệnh (tiêu chí 2)
#   cp .env.example .env   # rồi đặt AGENT_API_KEY trong .env
#   docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # không có .env vẫn chạy được
    environment:
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
